<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#635BFF" />
    <meta
      name="description"
      content="Domasi Hub — independent digital student utility network."
    />
    <link rel="icon" href="assets/icons/favicon.svg" />
    <title>Marketplace — Domasi Hub</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <a class="brand" href="home.html"
          ><span class="brand-logo"
            ><img
              src="assets/logo/domasi-hub-logo.svg"
              alt="Domasi Hub" /></span></a
        ><button
          class="icon-btn"
          onclick="window.toggleTheme()"
          aria-label="Toggle theme"
        >
          <img src="assets/icons/spark.svg" />
        </button>
      </header>
      <main class="main">
        <section class="page-title">
          <span class="eyebrow">MARKETPLACE</span>
          <h1>Buy. Sell. Trade.</h1>
          <p>Campus goods and services from students around Domasi.</p>
        </section>
        <div class="toolbar">
          <input
            id="marketSearch"
            class="control"
            placeholder="Search listings..."
          /><a class="btn btn-primary" href="sell.html">Create listing</a>
        </div>
        <p id="marketStatus" class="muted" style="margin: 16px 0">
          Loading listings...
        </p>
        <section id="marketGrid" class="cards market"></section>
      </main>
      <nav class="bottom-nav">
        <a href="home.html"
          ><img src="assets/icons/home.svg" /><span>Home</span></a
        ><a href="marketplace.html"
          ><img src="assets/icons/search.svg" /><span>Explore</span></a
        ><a class="create" href="sell.html"
          ><img src="assets/icons/plus.svg" /><span class="sr-only"
            >Create</span
          ></a
        ><a href="notifications.html"
          ><img src="assets/icons/bell.svg" /><span>Alerts</span></a
        ><a href="profile.html"
          ><img src="assets/icons/profile.svg" /><span>Me</span></a
        >
      </nav>
    </div>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/marketplace.js"></script>
  </body>
</html>
