<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Domasi Hub | My Uploads</title>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header-nav.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/mobile-nav.css" />
    <link rel="stylesheet" href="css/my-uploads.css" />
    <link rel="manifest" href="manifest.json" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%230066FF'/><stop offset='100%' stop-color='%2300D4FF'/></linearGradient></defs><rect width='32' height='32' rx='6' fill='%230F172A'/><path d='M 12 6 C 22 6 26 11 26 16 C 26 21 22 26 12 26 L 7 26 L 7 6 Z' fill='none' stroke='url(%23g)' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/><line x1='7' y1='16' x2='18' y2='16' stroke='url(%23g)' stroke-width='3.5' stroke-linecap='round'/><circle cx='18' cy='16' r='2.5' fill='%2300D4FF'/></svg>"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
  </head>
  <body class="is-native-app">
    <header class="main-header">
      <div class="logo">
        <h1>
          <a
            href="home.html"
            class="logo-link"
            aria-label="Domasi Hub Homepage"
          >
            <img
              src="assets/logo.svg"
              alt="Domasi Hub Logo"
              class="header-logo-img"
            />
          </a>
        </h1>
      </div>
      <nav class="main-nav">
        <a
          href="profile.html"
          class="settings-back-btn"
          aria-label="Return to Profile"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Profile</span>
        </a>
      </nav>
    </header>

    <main class="my-uploads-main">
      <div id="myUploadsContainer" class="uploads-grid">
        <div class="uploads-loading">
          <div class="spinner-ring"></div>
          <p>Loading your contributions...</p>
        </div>
      </div>
    </main>

    <!-- Edit Modal Overlay -->
    <div id="editModal" class="upload-modal-overlay" style="display: none">
      <div class="upload-modal-card">
        <div class="modal-header">
          <h3>Edit Listing</h3>
          <button id="closeModalBtn" class="close-modal-icon">&times;</button>
        </div>
        <form id="editUploadForm">
          <input type="hidden" id="editItemId" />
          <input type="hidden" id="editItemCategory" />

          <div class="form-group">
            <label for="editTitle">Title / Name</label>
            <input type="text" id="editTitle" required class="form-control" />
          </div>

          <div class="form-group" id="editDescriptionGroup">
            <label for="editDescription">Description / Details</label>
            <textarea
              id="editDescription"
              rows="3"
              class="form-control"
            ></textarea>
          </div>

          <div class="form-group" id="editPriceGroup">
            <label for="editPrice">Price / Rate (MWK)</label>
            <input type="text" id="editPrice" class="form-control" />
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="cancelModalBtn">
              Cancel
            </button>
            <button type="submit" class="btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <div id="deleteModal" class="upload-modal-overlay" style="display: none">
      <div class="upload-modal-card">
        <div class="modal-header">
          <h3>Confirm Deletion</h3>
        </div>
        <p
          style="
            color: var(--text-muted, #64748b);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
          "
        >
          Are you sure you want to delete this item? This action cannot be
          undone.
        </p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelDeleteBtn">
            Cancel
          </button>
          <button type="button" class="btn-danger" id="confirmDeleteBtn">
            Delete
          </button>
        </div>
      </div>
    </div>

    <script src="js/app.js" type="module"></script>
    <script src="js/my-uploads.js" type="module"></script>
    <script src="js/theme.js" defer></script>
  </body>
</html>
