<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#635BFF" />
    <meta
      name="description"
      content="Domasi Hub — independent digital student utility network."
    />
    <link rel="icon" href="assets/icons/favicon.svg" />
    <title>Sign In — Domasi Hub</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <main class="auth-page">
      <div class="auth-shell">
        <a class="back" href="index.html">← Back to Domasi Hub</a>
        <div class="auth-brand">
          <div class="auth-logo">
            <img src="assets/logo/domasi-hub-logo.svg" alt="Domasi Hub" />
          </div>
          <p>Your campus, connected.</p>
        </div>
        <section class="auth-card">
          <h2>Welcome back</h2>
          <p>Sign in to access your campus utility network.</p>
          <div id="formMessage" class="form-message"></div>
          <form id="signinForm" class="auth-form" novalidate>
            <div class="field">
              <label for="email">Email address</label
              ><input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
              />
            </div>
            <div class="field">
              <label for="password">Password</label
              ><input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Your password"
                required
              />
            </div>
            <button id="signinButton" class="auth-submit" type="submit">
              Sign in
            </button>
          </form>
          <div class="auth-footer">
            New to Domasi Hub? <a href="signup.html">Create an account</a>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="js/signin.js"></script>
  </body>
</html>
