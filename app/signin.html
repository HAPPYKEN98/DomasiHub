<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#6C5CE7"
    >

    <title>Sign In — Domasi Hub</title>

    <link
        rel="stylesheet"
        href="../src/css/theme.css"
    >

    <link
        rel="stylesheet"
        href="../src/css/auth.css"
    >

</head>


<body>

    <main class="auth-page">

        <div class="auth-shell">

            <a
                href="index.html"
                class="back-link"
            >
                ← Back to Domasi Hub
            </a>


            <div class="auth-brand">

                <div class="auth-logo">

                    <img
                        src="../assets/logo/domasi-hub-logo.png"
                        alt="Domasi Hub"
                    >

                </div>

                <h1>Domasi Hub</h1>

                <p>
                    Your campus, connected.
                </p>

            </div>


            <section class="auth-card">

                <h2>
                    Welcome back
                </h2>

                <p>
                    Sign in to access your Domasi Hub account.
                </p>


                <div
                    id="formMessage"
                    class="form-message"
                    role="alert"
                ></div>


                <form
                    id="signinForm"
                    class="auth-form"
                    novalidate
                >


                    <div class="form-group">

                        <label for="registrationNumber">
                            Registration number
                        </label>

                        <input
                            id="registrationNumber"
                            name="registrationNumber"
                            class="form-input"
                            type="text"
                            placeholder="e.g. BED/SCI/1234/26"
                            autocomplete="username"
                            autocapitalize="characters"
                            maxlength="30"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            id="password"
                            name="password"
                            class="form-input"
                            type="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth-submit"
                        id="signinButton"
                    >
                        Sign in
                    </button>

                </form>


                <div class="auth-footer">

                    Don't have an account?

                    <a href="signup.html">
                        Create one
                    </a>

                </div>

            </section>

        </div>

    </main>


    <script
        type="module"
        src="../src/js/auth/signin.js"
    ></script>

</body>

</html>
