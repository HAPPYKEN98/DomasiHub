      <nav class="main-nav">

        <div class="theme-switch-wrapper">
          <button
            id="themeToggle"
            class="theme-toggle-btn"
            aria-label="Toggle Dark Mode"
          >
            <span class="toggle-track">
              <span class="toggle-thumb">
                <svg
                  class="sun-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"

                  viewBox="0 0 24 24"

                </svg>
              </span>
            </span>

      <section class="section-title">
        <h3>Student Printing Hub</h3>
        <p>

      <section class="printers-grid" id="printing-grid">
        <p style="text-align: center; padding: 2rem; width: 100%">
          Loading printer stations...

      </section>
