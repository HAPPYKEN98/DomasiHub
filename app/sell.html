<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#635BFF" />
    <meta
      name="description"
      content="Domasi Hub — independent digital student utility network."
    />
    <link rel="icon" href="assets/icons/favicon.svg" />
    <title>Sell — Domasi Hub</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body data-auth="required">
    <div class="app">
      <header class="app-header">
        <a class="brand" href="home.html"
          ><span class="brand-logo"
            ><img
              src="assets/logo/domasi-hub-logo.svg"
              alt="Domasi Hub" /></span></a
        ><button
          class="icon-btn"
          onclick="window.toggleTheme()"
          aria-label="Toggle theme"
        >
          <img src="assets/icons/spark.svg" />
        </button>
      </header>
      <main class="main">
        <section class="page-title">
          <span class="eyebrow">MARKETPLACE</span>
          <h1>Create a listing</h1>
          <p>Give students the details they need to buy from you safely.</p>
        </section>
        <section class="card">
          <div class="card-content">
            <div id="formMessage" class="form-message"></div>
            <form id="sellForm" class="form-grid">
              <div class="field">
                <label>Title</label
                ><input
                  name="title"
                  maxlength="100"
                  required
                  placeholder="e.g. Scientific calculator"
                />
              </div>
              <div class="form-grid two">
                <div class="field">
                  <label>Category</label
                  ><select name="category" required>
                    <option value="">Select category</option>
                    <option>Academic</option>
                    <option>Electronics</option>
                    <option>Clothing</option>
                    <option>Food</option>
                    <option>Services</option>
                    <option>Other</option>
                  </select>
                </div>
                <div class="field">
                  <label>Price (MWK)</label
                  ><input
                    name="price"
                    type="number"
                    min="0"
                    step="1"
                    required
                  />
                </div>
              </div>
              <div class="form-grid two">
                <div class="field">
                  <label>Condition</label
                  ><input name="condition" placeholder="New / Used" />
                </div>
                <div class="field">
                  <label>Location</label
                  ><input
                    name="location"
                    maxlength="120"
                    placeholder="Around Domasi"
                  />
                </div>
              </div>
              <div class="field">
                <label>WhatsApp / contact</label
                ><input
                  name="contact"
                  type="tel"
                  maxlength="20"
                  required
                  placeholder="+265..."
                />
              </div>
              <button id="sellButton" class="btn btn-primary" type="submit">
                Publish listing
              </button>
            </form>
          </div>
        </section>
      </main>
      <nav class="bottom-nav">
        <a href="home.html"
          ><img src="assets/icons/home.svg" /><span>Home</span></a
        ><a href="marketplace.html"
          ><img src="assets/icons/search.svg" /><span>Explore</span></a
        ><a class="create" href="sell.html"
          ><img src="assets/icons/plus.svg" /><span class="sr-only"
            >Create</span
          ></a
        ><a href="notifications.html"
          ><img src="assets/icons/bell.svg" /><span>Alerts</span></a
        ><a href="profile.html"
          ><img src="assets/icons/profile.svg" /><span>Me</span></a
        >
      </nav>
    </div>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/sell.js"></script>
    <script type="module" src="js/pages.js"></script>
  </body>
</html>
